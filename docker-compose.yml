services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: dinehub
      POSTGRES_PASSWORD: dinehub_dev_only
      POSTGRES_DB: dinehub
    volumes:
      - dinehub_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dinehub"]
      interval: 5s
      retries: 10
volumes:
  dinehub_pg:
